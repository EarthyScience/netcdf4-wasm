name: Deploy main docs/viewer → gh-pages/viewer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: write-all

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Install dependencies
        working-directory: docs/viewer
        run: npm install

      - name: Build docs/viewer
        working-directory: docs/viewer
        env:
          BASE_PATH: "/netcdf4-wasm/viewer"
          NEXT_PUBLIC_BASE_PATH: "/netcdf4-wasm/viewer"
        run: npm run build

      - name: Deploying viewer 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: docs/viewer/out
          target-folder: viewer
          clean: false