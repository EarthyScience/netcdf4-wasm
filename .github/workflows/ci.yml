name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  workflow_dispatch: # Manual trigger

defaults:
  run:
    shell: bash

jobs:
  core:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup repo
        uses: ./.github/actions

      - name: Check dependencies
        run: npm run check-deps

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm run test:coverage
