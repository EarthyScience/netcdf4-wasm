name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  workflow_dispatch:   # Manual trigger

defaults:
  run:
    shell: bash

jobs:
  core:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup repo
        uses: ./.github/actions

      - name: Check dependencies
        run: npm run check-deps

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm run test:coverage
  
  compatibility:
    name: Compatibility (${{ matrix.os }})
    needs: core
    timeout-minutes: 20
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup repo
        uses: ./.github/actions
      - name: Build
        run: npm run build
      - name: Run tests
        run: npm run test