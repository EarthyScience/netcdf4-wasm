<svg viewBox="-51 -47 102 96" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#036482;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#274760;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#644FF0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5141c4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F9F9F9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ECECEC;stop-opacity:1" />
    </linearGradient>
  </defs>

  <g>
    <!-- Chip outline with rounded corners and inward notch -->
    <path d="
      M -39,-45
      H -4.5
      A 4.5,4.5 0 0 0 4.5,-45
      H 39
      A 6,6 0 0 1 45,-39
      V 39
      A 6,6 0 0 1 39,45
      H -39
      A 6,6 0 0 1 -45,39
      V -39
      A 6,6 0 0 1 -39,-45
      Z
    " fill="none" stroke="#333" stroke-width="2"/>

    <!-- Grid cells -->
    <rect x="-39" y="-39" width="24" height="24" rx="2" fill="url(#tealGrad)"/>
    <rect x="-12" y="-39" width="24" height="24" rx="2" fill="url(#tealGrad)"/>
    <rect x="15" y="-39" width="24" height="24" rx="2" fill="url(#whiteGrad)"/>

    <rect x="-39" y="-12" width="24" height="24" rx="2" fill="url(#purpleGrad)"/>
    <rect x="-12" y="-12" width="51" height="24" rx="2" fill="url(#whiteGrad)"/>

    <text x="14" y="2" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#333">
      netCDF4
    </text>

    <rect x="-39" y="15" width="24" height="24" rx="2" fill="url(#whiteGrad)"/>
    <rect x="-12" y="15" width="24" height="24" rx="2" fill="url(#purpleGrad)"/>
    <rect x="15" y="15" width="24" height="24" rx="2" fill="url(#purpleGrad)"/>

    <text x="27" y="31" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="white">
      WA
    </text>

    <circle cx="27" cy="15.5" r="3" fill="white"/>

    <!-- IC pins -->
    <rect x="-51" y="-32" width="6" height="10" fill="#333"/>
    <rect x="-51" y="-5" width="6" height="10" fill="#333"/>
    <rect x="-51" y="22" width="6" height="10" fill="#333"/>

    <rect x="45" y="-32" width="6" height="10" fill="#333"/>
    <rect x="45" y="-5" width="6" height="10" fill="#333"/>
    <rect x="45" y="22" width="6" height="10" fill="#333"/>

    <rect x="-32" y="45" width="10" height="6" fill="#333"/>
    <rect x="-5" y="45" width="10" height="6" fill="#333"/>
    <rect x="22" y="45" width="10" height="6" fill="#333"/>
  </g>
</svg>